<title>RetroSocial</title>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #e9edf2;
  font-family: Arial, sans-serif;
  color: #333;
}

header {
  background: #3b5998;
  color: white;
  padding: 12px 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.language {
  display: flex;
  gap: 5px;
}

.language button {
  padding: 6px 10px;
  background: #2f4f88;
  color: white;
  border: 1px solid #8da4d0;
  border-radius: 3px;
  cursor: pointer;
}

.language button.active {
  background: white;
  color: #3b5998;
}

main {
  max-width: 700px;
  margin: 25px auto;
  padding: 0 10px;
}

.card {
  background: white;
  border: 1px solid #ccd3dc;
  border-radius: 4px;
  padding: 15px;
  margin-bottom: 15px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 15px;
}

.avatar {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  object-fit: cover;
  background: #ddd;
  border: 2px solid #ccd3dc;
}

.profile-info {
  flex: 1;
}

.profile-name {
  font-size: 21px;
  font-weight: bold;
  color: #315b9a;
}

input {
  width: 100%;
  padding: 9px;
  border: 1px solid #bbb;
  border-radius: 3px;
  margin-top: 7px;
  font-size: 14px;
}

textarea {
  width: 100%;
  height: 90px;
  padding: 10px;
  resize: vertical;
  border: 1px solid #bbb;
  border-radius: 3px;
  font-family: Arial, sans-serif;
  font-size: 14px;
}

.main-button {
  margin-top: 10px;
  background: #4b70b5;
  color: white;
  border: 0;
  padding: 9px 18px;
  border-radius: 3px;
  cursor: pointer;
}

.main-button:hover {
  background: #3b5998;
}

.delete-button {
  background: #c0392b;
  color: white;
  border: 0;
  padding: 7px 12px;
  border-radius: 3px;
  cursor: pointer;
  margin-top: 10px;
}

.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  background: #ddd;
}

.post-author {
  color: #315b9a;
  font-size: 17px;
  font-weight: bold;
}

small {
  color: #999;
}

.post-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 12px;
}
