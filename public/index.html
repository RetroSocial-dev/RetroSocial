<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>RetroSocial</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #e9edf2;
  font-family: Arial, sans-serif;
  color: #333;
}

header {
  background: #3b5998;
  color: white;
  padding: 12px 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.language {
  display: flex;
  gap: 5px;
}

.language button {
  padding: 6px 10px;
  background: #2f4f88;
  color: white;
  border: 1px solid #8da4d0;
  border-radius: 3px;
  cursor: pointer;
}

.language button.active {
  background: white;
  color: #3b5998;
}

main {
  max-width: 700px;
  margin: 25px auto;
  padding: 0 10px;
}

.card {
  background: white;
  border: 1px solid #ccd3dc;
  border-radius: 4px;
  padding: 15px;
  margin-bottom: 15px;
}

/* PROFILE */

.profile {
  display: flex;
  align-items: center;
  gap: 15px;
}

.avatar {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  object-fit: cover;
  background: #ddd;
  border: 2px solid #ccd3dc;
}

.profile-info {
  flex: 1;
}

.profile-name {
  font-size: 21px;
  font-weight: bold;
  color: #315b9a;
}

input {
  width: 100%;
  padding: 9px;
  border: 1px solid #bbb;
  border-radius: 3px;
  margin-top: 7px;
  font-size: 14px;
}

textarea {
  width: 100%;
  height: 90px;
  padding: 10px;
  resize: vertical;
  border: 1px solid #bbb;
  border-radius: 3px;
  font-family: Arial, sans-serif;
  font-size: 14px;
}

.main-button {
  margin-top: 10px;
  background: #4b70b5;
  color: white;
  border: 0;
  padding: 9px 18px;
  border-radius: 3px;
  cursor: pointer;
}

.main-button:hover {
  background: #3b5998;
}

.delete-button {
  background: #c0392b;
  color: white;
  border: 0;
  padding: 7px 12px;
  border-radius: 3px;
  cursor: pointer;
  margin-top: 10px;
}

.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  background: #ddd;
}

.post-author {
  color: #315b9a;
  font-size: 17px;
  font-weight: bold;
}

small {
  color: #999;
}

.post-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 12px;
}

.file-label {
  display: inline-block;
  margin-top: 8px;
  padding: 7px 10px;
  background: #eee;
  border: 1px solid #bbb;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
}

#avatarFile {
  display: none;
}

.avatar-preview {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  object-fit: cover;
  display: none;
  margin-top: 10px;
}

</style>

</head>

<body>

<header>

  <div class="logo">
    RetroSocial
  </div>

  <div class="language">

    <button
      id="ruButton"
      onclick="setLanguage('ru')"
    >
      🇷🇺 RU
    </button>

    <button
      id="enButton"
      onclick="setLanguage('en')"
    >
      🇬🇧 ENG
    </button>

  </div>

</header>

<main>

<!-- PROFILE -->

<div class="card">

  <h2 id="profileTitle">
    👤 Мой профиль
  </h2>

  <div class="profile">

    <img
      id="profileAvatar"
      class="avatar"
      src=""
      alt="avatar"
    >

    <div class="profile-info">

      <div
        id="profileName"
        class="profile-name"
      >
        Аноним
      </div>

      <input
        id="nickname"
        maxlength="30"
        placeholder="Твой ник"
      >

      <label
        class="file-label"
        for="avatarFile"
        id="avatarLabel"
      >
        🖼️ Выбрать аватар
      </label>

      <input
        id="avatarFile"
        type="file"
        accept="image/*"
      >

      <button
        class="main-button"
        onclick="saveProfile()"
        id="saveProfileButton"
      >
        Сохранить профиль
      </button>

    </div>

  </div>

</div>


<!-- NEW POST -->

<div class="card">

  <h2 id="welcome">
    Добро пожаловать 👋
  </h2>

  <p id="description">
    Соцсеть в стиле 2014 года.
  </p>

  <textarea
    id="text"
    maxlength="5000"
    placeholder="Что у тебя нового?"
  ></textarea>

  <button
    class="main-button"
    id="publishButton"
    onclick="post()"
  >
    Опубликовать
  </button>

</div>


<!-- POSTS -->

<div id="feed"></div>

</main>

  localStorage.getItem("language") || "ru";

  profile = JSON.parse(
    localStorage.getItem("profile") ||
    '{"name":"Аноним","avatar":""}'
  );

} catch (error) {

  profile = {
    name: "Аноним",
    avatar: ""
  };

}

   LANGUAGE
========================= */

function setLanguage(language) {

  currentLanguage = language;

  localStorage.setItem(
    "language",
    language
  );

  applyLanguage();
  loadPosts();

}

  document.documentElement.lang =

  document.getElementById(

  document.getElementById(

  ).placeholder = t.nickname;

  document.getElementById(
    "avatarLabel"
  ).textContent = t.avatar;

  document.getElementById(

  ).textContent = t.saveProfile;

  ).textContent = t.welcome;
