<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RetroSocial</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e9ebee;
      color: #222;
    }

    header {
      background: #3b5998;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      background: #3b5998;
      color: white;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .language-btn {
      background: white;
      color: #3b5998;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      border: 2px solid #ccc;
    }

    .profile-info {
      flex: 1;
    }

    .profile-info h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    input[type="file"] {
      margin-bottom: 10px;
      max-width: 100%;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .post {
      border-top: 1px solid #ddd;
      padding: 15px 0;
    }

    .post:first-child {
      border-top: none;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .post-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .post-author {
      font-weight: bold;
    }

    .post-date {
      color: #888;
      font-size: 12px;
    }

    .post-text {
      white-space: pre-wrap;
      word-wrap: break-word;
      margin: 10px 0;
    }

    .delete-btn {
      background: #d9534f;
      font-size: 12px;
      padding: 5px 9px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 20px;
    }

    .profile-buttons {
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 10px auto;
      }

      .profile {
        align-items: flex-start;
      }

      header {
        padding: 10px 12px;
      }

      header h1 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>RetroSocial</h1>

  <button
    id="languageButton"
    class="language-btn"
    onclick="toggleLanguage()"
  >
    EN
  </button>
</header>

<div class="container">

  <!-- ПРОФИЛЬ -->
  <div class="card">

    <div class="profile">

      <img
        id="profileAvatar"
        class="avatar"
        src=""
        alt="Avatar"
      >

      <div class="profile-info">

        <h2 id="profileName">
          Аноним
        </h2>

        <input
          id="nickname"
          type="text"
          maxlength="30"
          placeholder="Никнейм"
        >

        <input
          id="avatarFile"
          type="file"
          accept="image/*"
        >

        <div class="profile-buttons">

          <button
            id="saveProfileButton"
            onclick="saveProfile()"
          >
            Сохранить профиль
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- СОЗДАНИЕ ПОСТА -->
  <div class="card">

    <textarea
      id="postText"
      maxlength="5000"
      placeholder="Что нового?"
    ></textarea>

    <button
      id="postButton"
      onclick="createPost()"
    >
      Опубликовать
    </button>

  </div>


  <!-- ПОСТЫ -->
  <div class="card">

    <h2 id="feedTitle">
      Лента
    </h2>

    <div id="posts">
      <div class="empty">
        Загрузка...
      </div>
    </div>

  </div>

</div>


<script>

  let currentLanguage = "ru";


  /* =========================
     ПРОФИЛЬ
  ========================= */

  let profile = {
    name: "Аноним",
    avatar: ""
  };


  function loadProfile() {

    try {

      const saved =
        localStorage.getItem("profile");

      if (saved) {

        const parsed =
          JSON.parse(saved);

        if (parsed && typeof parsed === "object") {

          profile.name =
            parsed.name || "Аноним";

          profile.avatar =
            parsed.avatar || "";

        }

      }

    } catch (error) {

      console.error(
        "Ошибка загрузки профиля:",
        error
      );

    }

    updateProfile
