<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetroSocial</title>
<style>
body{margin:0;background:#e9edf2;font:14px Arial;color:#333}
header{background:#3b5998;color:white;padding:16px;font-size:22px;font-weight:bold}
main{max-width:700px;margin:25px auto}
.card{background:white;border:1px solid #ccd3dc;border-radius:4px;padding:15px;margin-bottom:15px}
textarea{width:100%;height:80px;box-sizing:border-box;padding:10px}
button{margin-top:10px;background:#4b70b5;color:white;border:0;padding:9px 18px;border-radius:3px}
.post h3{color:#315b9a;margin-bottom:4px}
small{color:#999}
</style>
</head>
<body>

<header>RetroSocial</header>

<main>
<div class="card">
<h2>Добро пожаловать 👋</h2>
<p>Соцсеть в стиле 2014 года.</p>
<textarea id="text" placeholder="Что у тебя нового?"></textarea>
<button onclick="post()">Опубликовать</button>
</div>

<div id="feed"></div>
</main>

<script>
const posts=[];

function post(){
    const text=document.getElementById("text").value.trim();
    if(!text)return;

    posts.unshift(text);
    document.getElementById("text").value="";
    render();
}

function render(){
    document.getElementById("feed").innerHTML=posts.map(text=>`
        <div class="card post">
            <h3>Герман</h3>
            <small>Только что</small>
            <p>${escapeHtml(text)}</p>
            ❤️ Нравится
        </div>
    `).join("");
}

function escapeHtml(text){
    return text.replace(/[&<>"']/g,c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[c]));
}
</script>

</body>
</html>
