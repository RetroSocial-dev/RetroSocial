<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>RetroSocial</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #e9edf2;
  font-family: Arial, sans-serif;
  color: #333;
}

header {
  background: #3b5998;
  color: white;
  padding: 12px 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.language {
  display: flex;
  gap: 5px;
}

.language button {
  padding: 6px 10px;
  background: #2f4f88;
  color: white;
  border: 1px solid #8da4d0;
  border-radius: 3px;
  cursor: pointer;
}

.language button.active {
  background: white;
  color: #3b5998;
}

main {
  max-width: 700px;
  margin: 25px auto;
  padding: 0 10px;
}

.card {
  background: white;
  border: 1px solid #ccd3dc;
  border-radius: 4px;
  padding: 15px;
  margin-bottom: 15px;
}


/* =========================
   PROFILE
========================= */

.profile {
  display: flex;
  align-items: center;
  gap: 15px;
}

.avatar {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  object-fit: cover;
  background: #ddd;
  border: 2px solid #ccd3dc;
}

.profile-info {
  flex: 1;
}

.profile-name {
  font-size: 21px;
  font-weight: bold;
  color: #315b9a;
}

input {
  width: 100%;
  padding: 9px;
  border: 1px solid #bbb;
  border-radius: 3px;
  margin-top: 7px;
  font-size: 14px;
}

textarea {
  width: 100%;
  height: 90px;
  padding: 10px;
  resize: vertical;
  border: 1px solid #bbb;
  border-radius: 3px;
  font-family: Arial, sans-serif;
  font-size: 14px;
}

.main-button {
  margin-top: 10px;
  background: #4b70b5;
  color: white;
  border: 0;
  padding: 9px 18px;
  border-radius: 3px;
  cursor: pointer;
}

.main-button:hover {
  background: #3b5998;
}

.delete-button {
  background: #c0392b;
  color: white;
  border: 0;
  padding: 7px 12px;
  border-radius: 3px;
  cursor: pointer;
  margin-top: 10px;
}

.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  background: #ddd;
  border: 1px solid #ccd3dc;
}

.post-author {
  color: #315b9a;
  font-size: 17px;
  font-weight: bold;
}

small {
  color: #999;
}

.post-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 12px;
}

.file-label {
  display: inline-block;
  margin-top: 8px;
  padding: 7px 10px;
  background: #eee;
  border: 1px solid #bbb;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
}

#avatarFile {
  display: none;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .profile {
    align-items: flex-start;
  }

  .profile-info {
    min-width: 0;
  }

  .avatar {
    width: 65px;
    height: 65px;
  }

}

</style>

</head>

<body>


<header>

  <div class="logo">
    RetroSocial
  </div>

  <div class="language">

    <button
      id="ruButton"
      onclick="setLanguage('ru')"
    >
      🇷🇺 RU
    </button>

    <button
      id="enButton"
      onclick="setLanguage('en')"
    >
      🇬🇧 ENG
    </button>

  </div>

</header>


<main>


<!-- =========================
     PROFILE
========================= -->

<div class="card">

  <h2 id="profileTitle">
    👤 Мой профиль
  </h2>

  <div class="profile">

    <img
      id="profileAvatar"
      class="avatar"
      src=""
      alt="avatar"
    >

    <div class="profile-info">

      <div
        id="profileName"
        class="profile-name"
      >
        Аноним
      </div>

      <input
        id="nickname"
        maxlength="30"
        placeholder="Твой ник"
      >

      <label
        class="file-label"
        for="avatarFile"
        id="avatarLabel"
      >
        🖼️ Выбрать аватар
      </label>

      <input
        id="avatarFile"
        type="file"
        accept="image/*"
      >

      <button
        class="main-button"
        onclick="saveProfile()"
        id="saveProfileButton"
      >
        Сохранить профиль
      </button>

    </div>

  </div>

</div>


<!-- =========================
     NEW POST
========================= -->

<div class="card">

  <h2 id="welcome">
    Добро пожаловать 👋
  </h2>

  <p id="description">
    Соцсеть в стиле 2014 года.
  </p>

  <textarea
    id="text"
    maxlength="5000"
    placeholder="Что у тебя нового?"
  ></textarea>

  <button
    class="main-button"
    id="publishButton"
    onclick="post()"
  >
    Опубликовать
  </button>

</div>


<!-- =========================
     POSTS
========================= -->

<div id="feed"></div>


</main>


<script>


/* =========================
   TRANSLATIONS
========================= */

const translations = {

  ru: {

    profileTitle: "👤 Мой профиль",
    nickname: "Твой ник",
    avatar: "🖼️ Выбрать аватар",
    saveProfile: "Сохранить профиль",
    profileSaved: "Профиль сохранён!",
    welcome: "Добро пожаловать 👋",
    description: "Соцсеть в стиле 2014 года.",
    placeholder: "Что у тебя нового?",
    publish: "Опубликовать",
    empty: "Пока нет постов.",
    delete: "🗑️ Удалить",
    deleteConfirm: "Удалить этот пост?",
    publishError: "Не удалось опубликовать пост.",
    deleteError: "Не удалось удалить пост.",
    loadError: "Не удалось загрузить посты.",
    avatarTooLarge: "Аватар слишком большой. Максимум 5 МБ.",
    avatarError: "Не удалось обработать аватар."

  },

  en: {

    profileTitle: "👤 My profile",
    nickname: "Your nickname",
    avatar: "🖼️ Choose avatar",
    saveProfile: "Save profile",
    profileSaved: "Profile saved!",
    welcome: "Welcome 👋",
    description: "A social network in the style of 2014.",
    placeholder: "What's new?",
    publish: "Publish",
    empty: "No posts yet.",
    delete: "🗑️ Delete",
    deleteConfirm: "Delete this post?",
    publishError: "Failed to publish the post.",
    deleteError: "Failed to delete the post.",
    loadError: "Failed to load posts.",
    avatarTooLarge: "Avatar is too large. Maximum 5 MB.",
    avatarError: "Failed to process avatar."

  }

};


/* =========================
   LANGUAGE
========================= */

let currentLanguage =
  localStorage.getItem("language") || "ru";


/* =========================
   PROFILE
========================= */

let profile = {
  name: "Аноним",
  avatar: ""
};


try {

  const savedProfile =
    localStorage.getItem("profile");

  if (savedProfile) {

    const parsed =
      JSON.parse(savedProfile);

    if (parsed && typeof parsed === "object") {

      profile.name =
        typeof parsed.name === "string"
          ? parsed.name
          : "Аноним";

      profile.avatar =
        typeof parsed.avatar === "string"
          ? parsed.avatar
          : "";

    }

  }

} catch (error) {

  console.error(
    "Profile load error:",
    error
  );

}


/* =========================
   LANGUAGE FUNCTIONS
========================= */

function setLanguage(language) {

  currentLanguage = language;

  localStorage.setItem(
    "language",
    language
  );

  applyLanguage();

  loadPosts();

}


function applyLanguage() {

  const t =
    translations[currentLanguage];


  document.documentElement.lang =
    currentLanguage;


  document.getElementById(
    "profileTitle"
  ).textContent =
    t.profileTitle;


  document.getElementById(
    "nickname"
  ).placeholder =
    t.nickname;


  document.getElementById(
    "avatarLabel"
  ).textContent =
    t.avatar;


  document.getElementById(
    "saveProfileButton"
  ).textContent =
    t.saveProfile;


  document.getElementById(
    "welcome"
  ).textContent =
    t.welcome;


  document.getElementById(
    "description"
  ).textContent =
    t.description;


  document.getElementById(
    "text"
  ).placeholder =
    t.placeholder;


  document.getElementById(
    "publishButton"
  ).textContent =
    t.publish;


  document.getElementById(
    "ruButton"
  ).classList.toggle(
    "active",
    currentLanguage === "ru"
  );


  document.getElementById(
    "enButton"
  ).classList.toggle(
    "active",
    currentLanguage === "en"
  );

}


/* =========================
   PROFILE UI
========================= */

function updateProfileUI() {

  document.getElementById(
    "profileName"
  ).textContent =
    profile.name || "Аноним";


  document.getElementById(
    "nickname"
  ).value =
    profile.name === "Аноним"
      ? ""
      : profile.name;


  const avatar =
    document.getElementById(
      "profileAvatar"
    );


  if (profile.avatar) {

    avatar.src =
      profile.avatar;

  } else {

    avatar.src =
      "https://www.gravatar.com/avatar/?d=mp";

  }

}


/* =========================
   SAVE PROFILE
========================= */

function saveProfile() {

  const name =
    document.getElementById(
      "nickname"
    ).value.trim();


  profile.name =
    name || "Аноним";


  try {

    localStorage.setItem(
      "profile",
      JSON.stringify(profile)
    );

  } catch (error) {

    console.error(
      "Profile save error:",
      error
    );

    alert(
      currentLanguage === "ru"
        ? "Не удалось сохранить профиль."
        : "Failed to save profile."
    );

    return;

  }


  updateProfileUI();


  alert(
    translations[currentLanguage]
      .profileSaved
  );

}


/* =========================
   AVATAR
========================= */

document.getElementById(
  "avatarFile"
).addEventListener(
  "change",
  async function(event) {

    const file =
      event.target.files[0];


    if (!file) {
      return;
    }


    const t =
      translations[currentLanguage];


    if (!file.type.startsWith("image/")) {

      alert(t.avatarError);

      event.target.value = "";

      return;

    }


    /*
      Исходный файл может быть большим,
      поэтому разрешаем до 5 МБ,
      а потом сжимаем его.
    */

    if (file.size > 5 * 1024 * 1024) {

      alert(t.avatarTooLarge);

      event.target.value = "";

      return;

    }


    try {

      const compressedAvatar =
        await compressAvatar(file);


      profile.avatar =
        compressedAvatar;


      /*
        Сохраняем аватар СРАЗУ,
        поэтому после перезагрузки
        он не исчезнет.
      */

      localStorage.setItem(
        "profile",
        JSON.stringify(profile)
      );


      updateProfileUI();


    } catch (error) {

      console.error(
        "Avatar error:",
        error
      );

      alert(t.avatarError);

    }


    event.target.value = "";

  }
);


/* =========================
   COMPRESS AVATAR
========================= */

function compressAvatar(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          const image =
            new Image();


          image.onload =
            function() {

              const maxSize = 256;

              let width =
                image.width;

              let height =
                image.height;


              if (
                width > maxSize ||
                height > maxSize
              ) {

                if (width > height) {

                  height =
                    Math.round(
                      height *
                      maxSize /
                      width
                    );

                  width =
                    maxSize;

                } else {

                  width =
                    Math.round(
                      width *
                      maxSize /
                      height
                    );

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              /*
                JPEG сильно уменьшает
                размер Base64-картинки.
              */

              const result =
                canvas.toDataURL(
                  "image/jpeg",
                  0.75
                );


              resolve(result);

            };


          image.onerror =
            function() {

              reject(
                new Error(
                  "Image loading failed"
                )
              );

            };


          image.src =
            reader.result;

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "File reading failed"
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts() {

  try {

    const response =
      await fetch(
        "/api/posts"
      );


    if (!response.ok) {

      throw new Error(
        "Load error"
      );

    }


    const posts =
      await response.json();


    render(posts);


  } catch (error) {

    console.error(error);


    document.getElementById(
      "feed"
    ).innerHTML = `
      <div class="card">
        ${escapeHtml(
          translations[currentLanguage]
            .loadError
        )}
      </div>
    `;

  }

}


/* =========================
   CREATE POST
========================= */

async function post() {

  const textarea =
    document.getElementById(
      "text"
    );


  const text =
    textarea.value.trim();


  if (!text) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/posts",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            text: text,

            author:
              profile.name ||
              "Аноним",

            avatar:
              profile.avatar ||
              ""

          })

        }
      );


    if (!response.ok) {

      throw new Error(
        "Post error"
      );

    }


    textarea.value = "";


    await loadPosts();


  } catch (error) {

    console.error(error);


    alert(
      translations[currentLanguage]
        .publishError
    );

  }

}


/* =========================
   DELETE POST
========================= */

async function deletePost(id) {

  const t =
    translations[currentLanguage];


  if (
    !confirm(
      t.deleteConfirm
    )
  ) {

    return;

  }


  try {

    const response =
      await fetch(
        `/api/posts/${id}`,
        {
          method: "DELETE"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Delete error"
      );

    }


    await loadPosts();


  } catch (error) {

    console.error(error);


    alert(
      t.deleteError
    );

  }

}


/* =========================
   RENDER POSTS
========================= */

function render(posts) {

  const feed =
    document.getElementById(
      "feed"
    );


  const t =
    translations[currentLanguage];


  if (posts.length === 0) {

    feed.innerHTML = `
      <div class="card">
        ${escapeHtml(t.empty)}
      </div>
    `;

    return;

  }


  feed.innerHTML =
    posts.map(
      post => {

        const date =
          new Date(
            post.created_at
          ).toLocaleString(
            currentLanguage === "ru"
              ? "ru-RU"
              : "en-US"
          );


        const avatar =
          post.avatar ||
          "https://www.gravatar.com/avatar/?d=mp";


        return `

          <div class="card post">

            <div class="post-header">

              <img
                class="post-avatar"
                src="${escapeHtml(avatar)}"
                alt="avatar"
                onerror="this.src='https://www.gravatar.com/avatar/?d=mp'"
              >

              <div>

                <div class="post-author">
                  ${escapeHtml(
                    post.author ||
                    "Аноним"
                  )}
                </div>

                <small>
                  ${escapeHtml(date)}
                </small>

              </div>

            </div>


            <p class="post-text">
              ${escapeHtml(
                post.text
              )}
            </p>


            <button
              class="delete-button"
              onclick="deletePost(${Number(post.id)})"
            >
              ${t.delete}
            </button>

          </div>

        `;

      }
    ).join("");

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(text) {

  return String(text)
    .replace(
      /[&<>"']/g,
      function(c) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[c];

      }
    );

}


/* =========================
   START
========================= */

applyLanguage();

updateProfileUI();

loadPosts();


setInterval(
  loadPosts,
  3000
);

</script>

</body>

</html>
